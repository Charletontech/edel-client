<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Edel App | Activities</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/coolalertjs@latest/dist/coolalert.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <script src="../js/config/tailwind.js"></script>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/utilities.css" />
    <link rel="stylesheet" href="../css/pages/activities.css" />
  </head>
  <body
    class="bg-brand-light text-slate-800 antialiased overflow-hidden flex h-screen h-[100dvh]"
  >
    <aside
      class="hidden lg:flex flex-col w-72 bg-brand-navy text-white h-full shadow-2xl z-50"
    >
      <div class="p-6">
        <a
          href="/"
          class="text-2xl font-bold tracking-tight flex items-center gap-3"
        >
          <div
            class="w-10 h-10 bg-brand-accent rounded-xl flex items-center justify-center text-brand-navy shadow-glow"
          >
            <i data-lucide="sparkles" class="w-6 h-6"></i>
          </div>
          Edel
        </a>
      </div>

      <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
        <a
          href="/discovery/"
          class="flex items-center gap-4 px-4 py-3 text-slate-400 hover:text-white hover:bg-white/5 rounded-2xl font-medium transition-all"
        >
          <i data-lucide="compass" class="w-5 h-5"></i> Discovery
        </a>
        <a
          href="/activities/"
          class="flex items-center gap-4 px-4 py-3 bg-white/10 text-brand-accent rounded-2xl font-bold transition-all border border-white/10"
        >
          <i data-lucide="map" class="w-5 h-5"></i> Activity Map
        </a>
        <a
          href="/billing/"
          class="flex items-center gap-4 px-4 py-3 text-slate-400 hover:text-white hover:bg-white/5 rounded-2xl font-medium transition-all"
        >
          <i data-lucide="credit-card" class="w-5 h-5"></i> Billing
        </a>
        <a
          href="/profile/"
          class="flex items-center gap-4 px-4 py-3 text-slate-400 hover:text-white hover:bg-white/5 rounded-2xl font-medium transition-all"
        >
          <i data-lucide="user" class="w-5 h-5"></i> Profile
        </a>
      </nav>

      <div class="p-4 border-t border-white/10 m-4 rounded-2xl bg-white/5">
        <div class="flex items-center gap-3">
          <img
            src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80"
            class="w-10 h-10 rounded-full border-2 border-brand-accent object-cover"
          />
          <div>
            <p class="text-sm font-bold text-white" id="sidebar-user-name">
              Edel User
            </p>
            <p class="text-xs text-slate-400" id="sidebar-role">
              Activity Center
            </p>
          </div>
        </div>
      </div>
    </aside>

    <main class="flex-1 flex flex-col h-full relative bg-slate-200">
      <div class="absolute inset-0 z-0 overflow-hidden">
        <img
          src="https://images.unsplash.com/photo-1524661135-423995f22d0b?auto=format&fit=crop&w=1600&q=80"
          class="w-full h-full object-cover opacity-60 mix-blend-multiply filter grayscale-[30%]"
        />
        <div class="absolute inset-0 bg-brand-blue/10"></div>

        <div class="absolute inset-0" id="map-markers-layer">
          <svg
            class="absolute inset-0 w-full h-full z-0 hidden lg:block"
            id="route-line"
            style="pointer-events: none"
          >
            <path
              d="M 400 300 Q 550 450 700 350"
              fill="none"
              stroke="#FACC15"
              stroke-width="4"
              stroke-dasharray="8 8"
              class="animate-[dash_20s_linear_infinite]"
            />
          </svg>

          <div
            class="absolute top-[350px] left-[700px] transform -translate-x-1/2 -translate-y-full z-10 hidden lg:block"
            id="marker-destination"
          >
            <div
              class="w-12 h-12 bg-brand-navy rounded-full border-4 border-white shadow-xl flex items-center justify-center"
            >
              <i data-lucide="home" class="w-5 h-5 text-white"></i>
            </div>
            <div class="w-1 h-8 bg-brand-navy mx-auto"></div>
            <div
              class="w-4 h-1 bg-black/30 rounded-full mx-auto blur-[2px]"
            ></div>
          </div>

          <div
            class="absolute top-1/2 left-1/2 lg:top-[300px] lg:left-[400px] transform -translate-x-1/2 -translate-y-1/2 z-20"
            id="marker-moving"
          >
            <div
              class="absolute inset-0 rounded-full bg-brand-accent/40 pulse-ring"
            ></div>
            <div
              class="w-16 h-16 bg-white rounded-full border-[5px] border-white shadow-2xl overflow-hidden relative z-10"
              id="moving-avatar"
            >
              <img
                src="https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=100&q=80"
                class="w-full h-full object-cover"
              />
            </div>
            <div
              class="bg-brand-navy text-white text-xs font-bold px-3 py-1.5 rounded-full absolute -top-10 left-1/2 transform -translate-x-1/2 shadow-lg whitespace-nowrap"
              id="moving-label"
            >
              Waiting for orders
            </div>
          </div>
        </div>
      </div>

      <div
        class="absolute top-0 left-0 w-full h-32 map-overlay-gradient z-10"
      ></div>

      <header
        class="absolute top-0 left-0 w-full z-20 p-4 lg:p-8 flex justify-between items-start pointer-events-none"
      >
        <div class="lg:hidden flex items-center gap-3 pointer-events-auto">
          <a
            href="/discovery/"
            class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-lg text-brand-navy hover:bg-slate-50"
          >
            <i data-lucide="arrow-left" class="w-6 h-6"></i>
          </a>
          <div
            class="bg-brand-navy px-4 py-2 rounded-full shadow-lg pointer-events-auto"
            id="mobile-status-badge"
          >
            <span class="text-white text-sm font-bold flex items-center gap-2">
              <span class="w-2 h-2 bg-brand-accent rounded-full"></span>
              Activity Center
            </span>
          </div>
        </div>

        <div
          class="hidden lg:block bg-brand-navy px-5 py-2.5 rounded-full shadow-lg pointer-events-auto"
          id="desktop-status-badge"
        >
          <span class="text-white text-sm font-bold flex items-center gap-2">
            <span class="w-2 h-2 bg-brand-accent rounded-full"></span>
            Activity Center
          </span>
        </div>

        <div
          class="pointer-events-auto bg-white/90 backdrop-blur p-1.5 rounded-xl shadow-lg border border-slate-100 flex items-center"
          id="view-toggle"
        >
          <button
            id="btn-view-customer"
            class="px-4 py-2 rounded-lg bg-brand-navy text-brand-accent font-bold text-xs transition-all shadow-sm"
          >
            Customer View
          </button>
          <button
            id="btn-view-provider"
            class="px-4 py-2 rounded-lg text-slate-500 font-bold text-xs hover:text-brand-navy transition-all"
          >
            Provider View
          </button>
        </div>
      </header>

      <div
        class="absolute bottom-0 left-0 w-full lg:top-24 lg:left-8 lg:bottom-auto lg:w-[440px] z-30 flex flex-col justify-end lg:justify-start pointer-events-none"
      >
        <div
          class="glass-panel w-full rounded-t-[2.5rem] lg:rounded-3xl shadow-floating border border-slate-100/50 pointer-events-auto flex flex-col max-h-[85vh] lg:max-h-[calc(100vh-8rem)] overflow-hidden"
        >
          <div
            class="w-full shrink-0 pt-5 pb-2 lg:hidden relative z-10 bg-white/50"
          >
            <div class="w-12 h-1.5 bg-slate-300 rounded-full mx-auto"></div>
          </div>

          <div class="flex-1 overflow-y-auto no-scrollbar w-full pb-40 lg:pb-6">
            <section id="view-customer" class="block"></section>
            <section id="view-provider" class="hidden"></section>
          </div>
        </div>
      </div>
    </main>

    <nav
      class="lg:hidden fixed bottom-0 w-full bg-white border-t border-slate-200 flex justify-between items-center px-6 py-3 pb-safe z-40 shadow-[0_-10px_20px_rgba(0,0,0,0.03)]"
    >
      <a
        href="/discovery/"
        class="flex flex-col items-center gap-1 text-slate-400 hover:text-brand-navy transition-colors"
      >
        <i data-lucide="compass" class="w-6 h-6"></i>
        <span class="text-[10px] font-medium">Discover</span>
      </a>
      <a
        href="/activities/"
        class="flex flex-col items-center gap-1 text-brand-navy"
      >
        <i data-lucide="map" class="w-6 h-6"></i>
        <span class="text-[10px] font-bold">Activity</span>
      </a>
      <div class="relative -top-6">
        <a
          href="/"
          class="w-14 h-14 bg-brand-accent rounded-full flex items-center justify-center text-brand-navy shadow-glow border-4 border-white transition-transform active:scale-95"
        >
          <i data-lucide="home" class="w-6 h-6"></i>
        </a>
      </div>
      <a
        href="/billing/"
        class="flex flex-col items-center gap-1 text-slate-400 hover:text-brand-navy transition-colors"
      >
        <i data-lucide="credit-card" class="w-6 h-6"></i>
        <span class="text-[10px] font-medium">Billing</span>
      </a>
      <a
        href="/profile/"
        class="flex flex-col items-center gap-1 text-slate-400 hover:text-brand-navy transition-colors"
      >
        <i data-lucide="user" class="w-6 h-6"></i>
        <span class="text-[10px] font-medium">Profile</span>
      </a>
    </nav>

    <div
      id="modal-overlay"
      class="fixed inset-0 bg-brand-navy/80 backdrop-blur-md z-[100] hidden flex-col justify-center items-center opacity-0 transition-opacity duration-300 p-6"
    >
      <div
        id="display-qr-modal"
        class="bg-white w-full max-w-sm rounded-[2.5rem] shadow-2xl hidden flex-col items-center p-8 transform scale-95 transition-transform duration-300 relative overflow-hidden"
      >
        <div class="absolute top-0 left-0 w-full h-32 bg-brand-navy"></div>
        <button
          type="button"
          data-close-modal
          class="absolute top-6 right-6 w-8 h-8 bg-white/20 rounded-full flex items-center justify-center text-white hover:bg-white/40 transition-colors z-10"
        >
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>

        <div class="relative z-10 flex flex-col items-center mt-4 w-full">
          <div
            class="w-16 h-16 bg-brand-accent rounded-2xl flex items-center justify-center border-4 border-white shadow-md mb-4"
          >
            <i data-lucide="shield-check" class="text-brand-navy w-8 h-8"></i>
          </div>
          <h3 class="text-brand-navy font-bold text-xl mb-1">Handshake QR</h3>
          <p class="text-slate-500 text-sm mb-4 text-center">
            Let the provider scan this to begin service.
          </p>
          <div class="w-full flex justify-center mb-6">
            <div id="qrcode-container" class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm flex items-center justify-center"></div>
          </div>
          <p id="qr-countdown" class="text-brand-navy font-bold text-sm mb-4">Expires in 3:00</p>
          <button id="btn-regenerate-qr" class="hidden text-brand-accent bg-brand-navy px-4 py-2 rounded-xl text-sm font-bold shadow-sm">Regenerate QR</button>
        </div>
      </div>

      <div
        id="scanner-modal"
        class="bg-brand-navy border border-white/10 w-full max-w-md rounded-[2.5rem] shadow-2xl hidden flex-col items-center p-8 transform scale-95 transition-transform duration-300"
      >
        <div class="w-full flex justify-between items-center mb-8">
          <div class="w-10 h-10"></div>
          <h3 class="text-white font-bold text-lg">Scan QR Code</h3>
          <button
            type="button"
            data-close-modal
            class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center text-white hover:bg-white/20 transition-colors"
          >
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        <p id="scanner-status" class="text-slate-400 text-center text-sm mb-4">
          Align the customer's QR code within the frame.
        </p>
        <div
          class="relative w-64 h-64 bg-black rounded-3xl overflow-hidden mb-6 shadow-[0_0_50px_rgba(250,204,21,0.15)] border border-white/5"
        >
          <div id="qr-reader" class="w-full h-full"></div>
          <div class="scan-line pointer-events-none"></div>
        </div>
        <button id="btn-retry-scan" class="hidden w-full py-3 bg-brand-accent text-brand-navy font-bold rounded-xl shadow-lg mt-2">Retry Scan</button>
      </div>
    </div>

    <script src="../js/modules/core.js"></script>
    <script src="../js/config/env.js"></script>
    <script src="../js/modules/api.js"></script>
    <script src="../js/modules/ui-utils.js"></script>
    <script src="../js/modules/location.js"></script>
    <script src="../js/modules/auth.js"></script>
    <script src="../js/modules/ui.js"></script>
    <script src="../js/pages/activities.js"></script>
  </body>
</html>
