<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-del Admin Console</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/images/edel-logo-main.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Alerts -->
    <script src="https://cdn.jsdelivr.net/npm/coolalertjs@latest/dist/coolalert.min.js"></script>

    <!-- Tailwind Config -->
    <script src="../js/config/tailwind.js"></script>

    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/utilities.css" />
    <link rel="stylesheet" href="../css/pages/admin.css" />
  </head>
  <body class="bg-brand-light text-slate-800 antialiased font-sans">
    <div class="flex min-h-screen overflow-hidden">
      <!-- Sidebar -->
      <aside
        class="fixed inset-y-0 left-0 z-50 w-64 bg-brand-navy text-white flex-shrink-0 flex flex-col transition-all duration-300 transform -translate-x-full lg:translate-x-0 lg:static lg:inset-0"
        id="sidebar"
      >
        <!-- Logo -->
        <div class="p-6">
          <a href="/" class="flex items-center gap-2 group">
            <div
              class="w-8 h-8 bg-brand-accent rounded-lg flex items-center justify-center text-brand-navy"
            >
              <i data-lucide="sparkles" class="w-5 h-5"></i>
            </div>
            <span class="text-xl font-bold tracking-tighter">E-del Admin</span>
          </a>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 px-4 space-y-1 py-4">
          <button
            data-module="dashboard"
            class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all hover:bg-white/5 active"
          >
            <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
            <span class="font-semibold text-sm">Dashboard</span>
          </button>
          <button
            data-module="users"
            class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all hover:bg-white/5"
          >
            <i data-lucide="users" class="w-5 h-5"></i>
            <span class="font-semibold text-sm">Users</span>
          </button>
          <button
            data-module="orders"
            class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all hover:bg-white/5"
          >
            <i data-lucide="shopping-bag" class="w-5 h-5"></i>
            <span class="font-semibold text-sm">Orders</span>
          </button>
          <button
            data-module="reports"
            class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all hover:bg-white/5 relative"
          >
            <i data-lucide="alert-circle" class="w-5 h-5"></i>
            <span class="font-semibold text-sm">Reports</span>
            <span
              class="absolute right-4 top-1/2 -translate-y-1/2 w-2 h-2 bg-red-500 rounded-full"
            ></span>
          </button>
          <button
            data-module="settings"
            class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all hover:bg-white/5"
          >
            <i data-lucide="settings" class="w-5 h-5"></i>
            <span class="font-semibold text-sm">Settings</span>
          </button>
          <button
            data-module="emails"
            class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all hover:bg-white/5"
          >
            <i data-lucide="mail-plus" class="w-5 h-5"></i>
            <span class="font-semibold text-sm">Emails</span>
          </button>
        </nav>

        <!-- Sidebar Footer -->
        <div class="p-4 border-t border-white/5">
          <div class="flex items-center gap-3 p-2">
            <img
              id="admin-avatar"
              src="../assets/images/avatar.png"
              alt="Admin"
              class="w-10 h-10 rounded-full border border-white/10"
              onerror="this.src='https://ui-avatars.com/api/?name=Admin&background=FACC15&color=06142E'"
            />
            <div class="overflow-hidden">
              <p class="text-xs font-bold truncate" id="admin-name">Admin</p>
              <p class="text-[10px] text-slate-400 truncate" id="admin-email">admin@edel.com</p>
            </div>
          </div>
          <button
            id="logout-button"
            class="w-full flex items-center gap-3 px-4 py-3 mt-2 rounded-xl text-red-400 hover:bg-red-400/10 transition-all text-sm font-semibold"
          >
            <i data-lucide="log-out" class="w-5 h-5"></i>
            Logout
          </button>
        </div>
      </aside>

      <!-- Main Content -->
      <div class="flex-1 flex flex-col min-w-0 bg-[#F8FAFC]">
        <!-- Top Bar -->
        <header
          class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 sticky top-0 z-40"
        >
          <div class="flex items-center gap-4 flex-1">
            <button class="lg:hidden text-slate-500" id="sidebar-toggle">
              <i data-lucide="menu"></i>
            </button>
            <div class="relative max-w-md w-full">
              <i
                data-lucide="search"
                class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"
              ></i>
              <input
                id="global-search"
                type="text"
                placeholder="Search current module..."
                class="w-full pl-10 pr-4 py-2 bg-slate-100 border-transparent focus:bg-white focus:border-brand-accent rounded-xl text-sm transition-all outline-none"
              />
            </div>
          </div>

          <div class="flex items-center gap-4">
            <div class="text-right">
              <p class="text-xs font-bold text-brand-navy" id="topbar-admin-name">Admin</p>
              <p class="text-[10px] text-slate-400">Admin Console</p>
            </div>
          </div>
        </header>

        <!-- Module Content Area -->
        <main class="flex-1 overflow-y-auto p-8" id="module-container">
            <!-- Content will be injected by admin.js -->
            <div class="flex items-center justify-center h-full">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-brand-navy"></div>
            </div>
        </main>
      </div>
    </div>

    <!-- Modals / Overlays Container -->
    <div id="modal-container" class="hidden"></div>
    <div id="sidebar-overlay" class="fixed inset-0 bg-brand-navy/40 backdrop-blur-sm z-45 hidden lg:hidden"></div>

    <script src="../js/config/env.js"></script>
    <script src="../js/modules/core.js"></script>
    <script src="../js/modules/api.js"></script>
    <script src="../js/modules/auth.js"></script>
    <script src="../js/modules/ui-utils.js"></script>
    <script src="../js/pages/admin.js"></script>
  </body>
</html>
