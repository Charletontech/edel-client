<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>E-del | Account Recovery</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/images/edel-logo-main.png" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/config/tailwind.js"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/utilities.css" />
    <link rel="stylesheet" href="../css/pages/auth.css" />
    
    <style>
      .recovery-container {
        min-height: 100vh;
        background: #F1F1F1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        position: relative;
        overflow: hidden;
      }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(40px);
        border: 1px solid rgba(45, 17, 87, 0.08);
        box-shadow: 
          0 25px 50px -12px rgba(45, 17, 87, 0.1);
        border-radius: 2.5rem;
        width: 100%;
        max-width: 480px;
        padding: 3rem;
        position: relative;
        z-index: 10;
      }

      .recovery-bg-blob {
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.1;
        z-index: 0;
      }
    </style>
  </head>
  <body class="antialiased selection:bg-brand-accent selection:text-brand-navy">
    
    <div class="recovery-container">
      <!-- Background Flourish -->
      <div class="recovery-bg-blob bg-[#3A1A6A] -top-48 -left-48 blob-1"></div>
      <div class="recovery-bg-blob bg-brand-accent -bottom-48 -right-48 blob-2"></div>

      <div class="glass-card fade-enter fade-enter-active">
        <!-- Logo -->
        <div class="flex justify-center mb-10">
          <a href="/" class="flex flex-col items-center gap-3 group">
            <img src="../assets/images/edel-logo-main.png" alt="E-del Logo" class="h-16 w-auto object-contain transition-transform group-hover:scale-105" />
          </a>
        </div>

        <!-- Text Content -->
        <div class="text-center mb-8">
          <h1 class="text-3xl font-extrabold text-brand-navy mb-3 tracking-tight">Forgot Password?</h1>
          <p class="text-slate-500 font-medium leading-relaxed">
            Enter your email below. We'll send you a secure link to reset your account access.
          </p>
        </div>

        <!-- Form -->
        <form id="forgot-password-form" class="space-y-6">
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-2 ml-1">Email Address</label>
            <div class="relative input-focus-lift transition-all">
              <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
              <input
                id="recovery-email"
                type="email" 
                required 
                placeholder="name@example.com"
                class="w-full pl-12 pr-4 py-4 bg-white/50 border border-slate-200 rounded-2xl text-brand-navy font-semibold placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-brand-accent/20 focus:border-brand-accent transition-all shadow-sm"
              />
            </div>
          </div>

          <button
            id="recovery-submit-btn"
            type="submit" 
            class="w-full bg-brand-navy text-brand-accent hover:bg-brand-blue font-bold text-lg py-4 rounded-2xl shadow-xl transition-all active:scale-[0.98] flex justify-center items-center gap-2"
          >
            Send Recovery Link
            <i data-lucide="arrow-right" class="w-5 h-5"></i>
          </button>
          <p id="recovery-feedback" class="text-sm font-semibold hidden"></p>
        </form>

        <!-- Footer Links -->
        <div class="mt-10 pt-8 border-t border-slate-100 flex flex-col items-center gap-4">
          <a href="/auth/" class="text-slate-500 hover:text-brand-navy font-bold text-sm flex items-center gap-2 transition-colors">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Back to Sign In
          </a>
          <p class="text-xs text-slate-400 font-medium text-center">
            If you're having trouble, please contact 
            <a href="/contact/" class="text-brand-navy hover:underline">Support</a>
          </p>
        </div>
      </div>
    </div>

    <script src="../js/modules/core.js"></script>
    <script src="../js/config/env.js"></script>
    <script src="../js/modules/api.js"></script>
    <script>
      if (window.lucide) window.lucide.createIcons();

      const form = document.getElementById("forgot-password-form");
      const emailInput = document.getElementById("recovery-email");
      const submitBtn = document.getElementById("recovery-submit-btn");
      const feedback = document.getElementById("recovery-feedback");

      const setFeedback = (message, type) => {
        feedback.textContent = message;
        feedback.classList.remove("hidden", "text-red-600", "text-green-700");
        feedback.classList.add(type === "error" ? "text-red-600" : "text-green-700");
      };

      form?.addEventListener("submit", async (event) => {
        event.preventDefault();
        const email = emailInput?.value?.trim() || "";
        if (!email) {
          setFeedback("Please enter your email address.", "error");
          return;
        }

        const original = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = "Sending...";

        try {
          const response = await EdelModules.api.post("/api/auth/forgot-password", { email }, { silent: true });
          setFeedback(response.message || "If this email exists, a reset link has been sent.", "success");
        } catch (error) {
          setFeedback(error.message || "Could not process your request right now.", "error");
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = original;
          if (window.lucide) window.lucide.createIcons();
        }
      });
    </script>
  </body>
</html>
