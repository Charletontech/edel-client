<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Edel — Discover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      :root {
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --primary-light: #818cf8;
        --secondary: #f59e0b;
        --accent: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
        --bg-primary: #0f172a;
        --bg-secondary: #1e293b;
        --bg-tertiary: #334155;
        --bg-glass: rgba(30, 41, 59, 0.7);
        --bg-glass-light: rgba(255, 255, 255, 0.05);
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --border: rgba(255, 255, 255, 0.1);
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
        --shadow-md:
          0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
        --shadow-lg:
          0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
        --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.3);
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-xl: 24px;
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        overflow-x: hidden;
        min-height: 100vh;
        position: relative;
      }

      /* Animated Background Mesh */
      .bg-mesh {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        overflow: hidden;
      }

      .bg-mesh::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background:
          radial-gradient(
            circle at 20% 50%,
            rgba(99, 102, 241, 0.15) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(16, 185, 129, 0.1) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 50% 10%,
            rgba(245, 158, 11, 0.08) 0%,
            transparent 50%
          );
        animation: meshRotate 30s linear infinite;
      }

      @keyframes meshRotate {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* Noise Texture Overlay */
      .noise-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.03;
        z-index: -1;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        pointer-events: none;
      }

      /* App Container */
      .app-container {
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
        position: relative;
        background: linear-gradient(
          180deg,
          rgba(15, 23, 42, 0.95) 0%,
          rgba(15, 23, 42, 0.98) 100%
        );
        backdrop-filter: blur(20px);
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border);
      }

      /* Header */
      .header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border);
        padding: 16px 20px;
        transition: var(--transition);
      }

      .header.scrolled {
        box-shadow: var(--shadow-lg);
      }

      .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo-icon {
        width: 36px;
        height: 36px;
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 18px;
        color: white;
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        position: relative;
        overflow: hidden;
      }

      .logo-icon::after {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(
          45deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        animation: shimmer 3s infinite;
      }

      @keyframes shimmer {
        0% {
          transform: translateX(-100%) rotate(45deg);
        }
        100% {
          transform: translateX(100%) rotate(45deg);
        }
      }

      .logo-text {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-weight: 800;
        font-size: 22px;
        background: linear-gradient(135deg, #fff, var(--primary-light));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .header-actions {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: var(--bg-glass-light);
        border: 1px solid var(--border);
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: var(--transition);
        position: relative;
        overflow: hidden;
      }

      .icon-btn:hover {
        background: var(--bg-glass);
        color: var(--text-primary);
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }

      .icon-btn .badge {
        position: absolute;
        top: -2px;
        right: -2px;
        width: 18px;
        height: 18px;
        background: var(--danger);
        border-radius: 50%;
        font-size: 10px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--bg-primary);
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
      }

      /* Location Bar */
      .location-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: var(--bg-glass-light);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        font-size: 13px;
        color: var(--text-secondary);
        cursor: pointer;
        transition: var(--transition);
      }

      .location-bar:hover {
        background: var(--bg-glass);
        border-color: var(--primary);
      }

      .location-bar i {
        color: var(--primary-light);
      }

      .location-bar .loc-text {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .location-bar .loc-status {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent);
        animation: blink 2s infinite;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      /* Search Section */
      .search-section {
        padding: 0 20px 16px;
      }

      .search-container {
        position: relative;
        margin-bottom: 16px;
      }

      .search-input {
        width: 100%;
        padding: 14px 16px 14px 48px;
        background: var(--bg-glass);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        color: var(--text-primary);
        font-size: 15px;
        font-family: "Inter", sans-serif;
        transition: var(--transition);
        outline: none;
      }

      .search-input:focus {
        border-color: var(--primary);
        box-shadow:
          0 0 0 3px rgba(99, 102, 241, 0.15),
          var(--shadow-glow);
        background: var(--bg-secondary);
      }

      .search-input::placeholder {
        color: var(--text-muted);
      }

      .search-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 18px;
      }

      .search-filters {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
        scrollbar-width: none;
      }

      .search-filters::-webkit-scrollbar {
        display: none;
      }

      .filter-chip {
        padding: 8px 16px;
        background: var(--bg-glass-light);
        border: 1px solid var(--border);
        border-radius: 100px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
        white-space: nowrap;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .filter-chip:hover {
        background: var(--bg-glass);
        border-color: var(--primary-light);
        color: var(--text-primary);
      }

      .filter-chip.active {
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
        color: white;
        border-color: transparent;
        box-shadow: var(--shadow-glow);
      }

      .filter-chip i {
        font-size: 12px;
      }

      /* User Type Toggle */
      .user-toggle {
        display: flex;
        padding: 4px;
        background: var(--bg-glass-light);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        margin: 0 20px 20px;
        position: relative;
      }

      .toggle-btn {
        flex: 1;
        padding: 10px;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
        background: transparent;
        border: none;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: var(--transition);
        position: relative;
        z-index: 1;
      }

      .toggle-btn.active {
        color: white;
      }

      .toggle-slider {
        position: absolute;
        top: 4px;
        left: 4px;
        width: calc(50% - 4px);
        height: calc(100% - 8px);
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
        border-radius: 10px;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: var(--shadow-md);
      }

      .user-toggle.provider-active .toggle-slider {
        transform: translateX(100%);
      }

      /* Section Headers */
      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
        margin-bottom: 16px;
      }

      .section-title {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 18px;
        font-weight: 700;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .section-title i {
        color: var(--primary-light);
      }

      .section-action {
        font-size: 13px;
        font-weight: 600;
        color: var(--primary-light);
        cursor: pointer;
        transition: var(--transition);
      }

      .section-action:hover {
        color: var(--primary);
      }

      /* Stats Bar */
      .stats-bar {
        display: flex;
        gap: 12px;
        padding: 0 20px;
        margin-bottom: 24px;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .stats-bar::-webkit-scrollbar {
        display: none;
      }

      .stat-card {
        min-width: 140px;
        padding: 16px;
        background: var(--bg-glass);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        position: relative;
        overflow: hidden;
        transition: var(--transition);
      }

      .stat-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
        border-color: var(--primary-light);
      }

      .stat-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: linear-gradient(
          90deg,
          var(--primary),
          var(--primary-light)
        );
      }

      .stat-value {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 24px;
        font-weight: 800;
        color: var(--text-primary);
        margin-bottom: 4px;
      }

      .stat-label {
        font-size: 12px;
        color: var(--text-muted);
        font-weight: 500;
      }

      .stat-icon {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: rgba(99, 102, 241, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary-light);
        font-size: 14px;
      }

      /* Listing Cards */
      .listings-container {
        padding: 0 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-bottom: 100px;
      }

      .listing-card {
        background: var(--bg-glass);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        overflow: hidden;
        transition: var(--transition);
        cursor: pointer;
        position: relative;
      }

      .listing-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-lg), var(--shadow-glow);
        border-color: var(--primary-light);
      }

      .listing-card.featured::before {
        content: "Featured";
        position: absolute;
        top: 12px;
        left: -28px;
        background: linear-gradient(135deg, var(--secondary), #d97706);
        color: white;
        font-size: 10px;
        font-weight: 700;
        padding: 4px 28px;
        transform: rotate(-45deg);
        z-index: 10;
        box-shadow: var(--shadow-sm);
      }

      .listing-image {
        width: 100%;
        height: 180px;
        object-fit: cover;
        position: relative;
      }

      .listing-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
      }

      .listing-card:hover .listing-image img {
        transform: scale(1.05);
      }

      .listing-image-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 60%;
        background: linear-gradient(to top, rgba(15, 23, 42, 0.9), transparent);
        display: flex;
        align-items: flex-end;
        padding: 12px;
      }

      .status-tag {
        padding: 4px 10px;
        border-radius: 100px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        backdrop-filter: blur(10px);
      }

      .status-tag.available {
        background: rgba(16, 185, 129, 0.2);
        color: #34d399;
        border: 1px solid rgba(16, 185, 129, 0.3);
      }

      .status-tag.busy {
        background: rgba(245, 158, 11, 0.2);
        color: #fbbf24;
        border: 1px solid rgba(245, 158, 11, 0.3);
      }

      .status-tag.unavailable {
        background: rgba(239, 68, 68, 0.2);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.3);
      }

      .listing-content {
        padding: 16px;
      }

      .listing-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 12px;
      }

      .provider-info {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .provider-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--bg-glass);
        box-shadow: var(--shadow-sm);
      }

      .provider-meta {
        display: flex;
        flex-direction: column;
      }

      .provider-name {
        font-weight: 600;
        font-size: 14px;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .tier-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        border-radius: 50%;
        font-size: 9px;
        color: white;
        box-shadow: 0 0 8px rgba(59, 130, 246, 0.4);
      }

      .provider-category {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 2px;
      }

      .distance-badge {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        background: var(--bg-glass-light);
        border: 1px solid var(--border);
        border-radius: 100px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
      }

      .listing-title {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 16px;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 8px;
        line-height: 1.4;
      }

      .listing-description {
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.5;
        margin-bottom: 12px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .listing-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }

      .price-tag {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 18px;
        font-weight: 800;
        color: var(--accent);
      }

      .price-tag .currency {
        font-size: 13px;
        font-weight: 600;
        margin-right: 2px;
      }

      .price-tag .period {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-muted);
      }

      .rating {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .rating-stars {
        display: flex;
        gap: 2px;
      }

      .rating-stars i {
        font-size: 12px;
        color: var(--secondary);
      }

      .rating-value {
        font-size: 13px;
        font-weight: 700;
        color: var(--text-primary);
      }

      .order-btn {
        padding: 10px 20px;
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
        color: white;
        border: none;
        border-radius: var(--radius-md);
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: var(--transition);
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      }

      .order-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
      }

      .order-btn:disabled {
        background: var(--bg-tertiary);
        color: var(--text-muted);
        cursor: not-allowed;
        box-shadow: none;
      }

      /* Request Cards (Provider View) */
      .request-card {
        background: var(--bg-glass);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 16px;
        transition: var(--transition);
        cursor: pointer;
        position: relative;
        overflow: hidden;
      }

      .request-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-lg);
        border-color: var(--primary-light);
      }

      .request-card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        width: 4px;
        height: 100%;
        background: linear-gradient(
          to bottom,
          var(--primary),
          var(--primary-light)
        );
      }

      .request-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 12px;
      }

      .request-title {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 15px;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 4px;
      }

      .request-time {
        font-size: 12px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .request-budget {
        padding: 6px 12px;
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.2);
        border-radius: var(--radius-md);
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 14px;
        font-weight: 700;
        color: var(--accent);
      }

      .request-body {
        margin-bottom: 12px;
      }

      .request-description {
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.5;
        margin-bottom: 12px;
      }

      .request-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .request-tag {
        padding: 4px 10px;
        background: var(--bg-glass-light);
        border: 1px solid var(--border);
        border-radius: 100px;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-secondary);
      }

      .request-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }

      .requester-info {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .requester-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        object-fit: cover;
      }

      .requester-meta {
        display: flex;
        flex-direction: column;
      }

      .nav-item.active {
        color: var(--primary-light);

      .nav-item.active::before {
        content: "";
        position: absolute;
        top: -8px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--primary-light);
        box-shadow: 0 0 10px var(--primary-light);

        font-size: 20px;

        transform: translateY(-2px);

        font-size: 11px;

      /* Location Permission Modal */
      .modal-overlay {
        position: fixed;
        top: 0;

        opacity: 1;

      .modal {
        background: var(--bg-secondary);

        transform: scale(1) translateY(0);

      .modal-icon {
        width: 64px;

      .btn {
        width: 100%;

        font-size: 14px;
        font-weight: 700;

        transition: var(--transition);
        border: none;
        font-family: "Inter", sans-serif;
      }

      .btn-primary {
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
        color: white;
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
      }

      .btn-secondary {
        background: var(--bg-glass);
        color: var(--text-secondary);
        border: 1px solid var(--border);
      }

      .btn-secondary:hover {
        background: var(--bg-glass-light);
        color: var(--text-primary);
      }

      /* Skeleton Loading */
      .skeleton {
        background: linear-gradient(
          90deg,
          var(--bg-glass) 25%,
          var(--bg-tertiary) 50%,
          var(--bg-glass) 75%
        );
        background-size: 200% 100%;
        animation: skeleton-loading 1.5s infinite;
        border-radius: var(--radius-md);
      }

      @keyframes skeleton-loading {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      /* Empty State */
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-muted);
      }

      .empty-state i {
        font-size: 48px;
        margin-bottom: 16px;
        opacity: 0.5;
      }

      .empty-state h3 {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 18px;
        color: var(--text-secondary);
        margin-bottom: 8px;
      }

      .empty-state p {
        font-size: 14px;
      }

      /* Toast Notification */
      .toast-container {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2000;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
      }

      .toast {
        padding: 12px 20px;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        font-weight: 500;
        animation:
          toastIn 0.3s ease,
          toastOut 0.3s ease 2.7s forwards;
        pointer-events: all;
        min-width: 280px;
      }

      .toast.success {
        border-left: 3px solid var(--accent);
      }

      .toast.error {
        border-left: 3px solid var(--danger);
      }

      .toast.info {
        border-left: 3px solid var(--primary);
      }

      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes toastOut {
        from {
          opacity: 1;
          transform: translateY(0);
        }
        to {
          opacity: 0;
          transform: translateY(-20px);
        }
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }

      ::-webkit-scrollbar-track {
        background: var(--bg-primary);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--bg-tertiary);
        border-radius: 3px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }

      /* Responsive */
      @media (max-width: 480px) {
        .app-container {
          border: none;
        }
      }

      /* Animations */
      .fade-in {
        animation: fadeIn 0.5s ease forwards;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .slide-up {
        animation: slideUp 0.4s ease forwards;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

    <!-- Location Permission Modal -->

    <script>
      // State Management

      // Mock Data - Requests
      const mockRequests = [
        {

        },
        {

          description:
            "Power keeps tripping when using the AC. Need a certified electrician to inspect and fix.",
          budget: 15000,
          category: "electrical",
          tags: ["ac", "power", "inspection"],
          distance: 1.5,
          time: "15 mins ago",
          requesterName: "Oluwaseun Adeleke",
          requesterAvatar: "https://i.pravatar.cc/150?img=33",

        },
        {

            "Had a house party last night. Need thorough cleaning of living room, kitchen and 2 bathrooms.",
          budget: 18000,
          category: "cleaning",
          tags: ["party", "deep-clean", "weekend"],
          distance: 0.8,
          time: "32 mins ago",

          requesterAvatar: "https://i.pravatar.cc/150?img=16",
          requesterRating: 100,
        },
        {
          id: 4,
          title: "Wardrobe Repair & Shelving",
          description:
            "Built-in wardrobe door hinges broken. Also need 3 additional shelves installed.",
          budget: 25000,
          category: "carpentry",
          tags: ["wardrobe", "shelves", "repair"],
          distance: 2.2,

          requesterName: "Yusuf Garba",
          requesterAvatar: "https://i.pravatar.cc/150?img=59",
          requesterRating: 94,
        },
      ];

      // DOM Elements
      const header = document.getElementById("header");
      const locationBar = document.getElementById("locationBar");
      const locationText = document.getElementById("locationText");
      const locationStatus = document.getElementById("locationStatus");
      const searchInput = document.getElementById("searchInput");
      const searchFilters = document.getElementById("searchFilters");
      const userToggle = document.getElementById("userToggle");
      const sectionTitle = document.getElementById("sectionTitle");
      const listingsContainer = document.getElementById("listingsContainer");
      const locationModal = document.getElementById("locationModal");
      const toastContainer = document.getElementById("toastContainer");

      // Initialize
      function init() {
        loadListings();
        setupEventListeners();
        checkLocationPermission();
        animateHeader();
      }

      // Header Scroll Effect
      function animateHeader() {
        window.addEventListener("scroll", () => {
          if (window.scrollY > 10) {
            header.classList.add("scrolled");
          } else {
            header.classList.remove("scrolled");
          }
        });
      }

      // Location Permission
      function checkLocationPermission() {
        if (!state.locationEnabled) {
          setTimeout(() => {
            locationModal.classList.add("active");
          }, 1000);
        }
      }

      function enableLocation() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              state.location = {
                lat: position.coords.latitude,
                lng: position.coords.longitude,
              };
              state.locationEnabled = true;
              locationModal.classList.remove("active");
              updateLocationUI();
              showToast("Location enabled successfully", "success");
              sortListingsByDistance();
            },
            (error) => {
              showToast(
                "Unable to get location. Please enter manually.",
                "error",
              );
            },
          );
        }
      }

      function updateLocationUI() {
        locationText.textContent = "Lekki Phase 1, Lagos";
        locationStatus.style.background = "var(--accent)";
        locationStatus.style.boxShadow = "0 0 8px var(--accent)";
      }

      // Event Listeners
      function setupEventListeners() {
        // Location
        document
          .getElementById("enableLocationBtn")
          .addEventListener("click", enableLocation);
        document
          .getElementById("manualLocationBtn")
          .addEventListener("click", () => {
            locationModal.classList.remove("active");
            locationText.textContent = "Enter location...";
            showToast("Please enter your location manually", "info");
          });

        locationBar.addEventListener("click", () => {
          locationModal.classList.add("active");
        });

        // Search
        searchInput.addEventListener("input", (e) => {
          state.searchQuery = e.target.value.toLowerCase();
          filterListings();
        });

        // Filters
        searchFilters.addEventListener("click", (e) => {
          const chip = e.target.closest(".filter-chip");
          if (!chip) return;

          document
            .querySelectorAll(".filter-chip")
            .forEach((c) => c.classList.remove("active"));
          chip.classList.add("active");
          state.activeFilter = chip.dataset.filter;
          filterListings();
        });

        // User Type Toggle
        userToggle.addEventListener("click", (e) => {
          const btn = e.target.closest(".toggle-btn");
          if (!btn) return;

          const type = btn.dataset.type;
          if (type === state.userType) return;

          state.userType = type;
          document
            .querySelectorAll(".toggle-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");

          if (type === "provider") {
            userToggle.classList.add("provider-active");
          } else {
            userToggle.classList.remove("provider-active");
          }

          loadListings();
        });

        // Navigation
        document.querySelectorAll(".nav-item").forEach((item) => {
          item.addEventListener("click", () => {
            document
              .querySelectorAll(".nav-item")
              .forEach((i) => i.classList.remove("active"));
            item.classList.add("active");
            showToast(
              `${item.dataset.page.charAt(0).toUpperCase() + item.dataset.page.slice(1)} page coming soon`,
              "info",
            );
          });
        });

        // View All
        document.getElementById("viewAllBtn").addEventListener("click", () => {
          showToast("View all listings coming soon", "info");
        });

        // Notifications
        document.getElementById("notifBtn").addEventListener("click", () => {
          showToast("No new notifications", "info");
        });

        // Profile
        document.getElementById("profileBtn").addEventListener("click", () => {
          showToast("Profile page coming soon", "info");
        });
      }

      // Load Listings
      function loadListings() {
        listingsContainer.innerHTML = "";

        if (state.userType === "customer") {
          sectionTitle.innerHTML =
            '<i class="fas fa-chart-line"></i> Trending Near You';
          renderServiceListings(mockServices);
        } else {
          sectionTitle.innerHTML =
            '<i class="fas fa-bullhorn"></i> Nearby Requests';
          renderRequestListings(mockRequests);
        }
      }

      // Render Service Cards
      function renderServiceListings(services) {
        services.forEach((service, index) => {
          const card = document.createElement("div");
          card.className = `listing-card ${service.featured ? "featured" : ""} slide-up`;
          card.style.animationDelay = `${index * 0.1}s`;

          const statusClass = service.status;
          const isDisabled = service.status !== "available";
          const btnText =
            service.status === "busy"
              ? "Busy"
              : service.status === "unavailable"
                ? "Unavailable"
                : "Order Now";

          card.innerHTML = `
                    <div class="listing-image">
                        <img src="${service.image}" alt="${service.title}" loading="lazy">
                        <div class="listing-image-overlay">
                            <span class="status-tag ${statusClass}">${service.status}</span>
                        </div>
                    </div>
                    <div class="listing-content">
                        <div class="listing-header">
                            <div class="provider-info">
                                <img src="${service.providerAvatar}" alt="${service.providerName}" class="provider-avatar">
                                <div class="provider-meta">
                                    <div class="provider-name">
                                        ${service.providerName}
                                        <span class="tier-badge" title="Rookie Tier">✓</span>
                                    </div>
                                    <div class="provider-category">${service.category.charAt(0).toUpperCase() + service.category.slice(1)}</div>
                                </div>
                            </div>
                            <div class="distance-badge">
                                <i class="fas fa-location-arrow"></i>
                                ${service.distance}km
                            </div>
                        </div>
                        <h3 class="listing-title">${service.title}</h3>
                        <p class="listing-description">${service.description}</p>
                        <div class="listing-footer">
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <div class="price-tag">
                                    <span class="currency">₦</span>${service.price.toLocaleString()}
                                    ${service.priceType === "from" ? '<span class="period">+</span>' : ""}
                                </div>
                                <div class="rating">
                                    <div class="rating-stars">
                                        ${generateStars(service.rating)}
                                    </div>
                                    <span class="rating-value">${service.rating}</span>
                                </div>
                            </div>
                            <button class="order-btn" ${isDisabled ? "disabled" : ""} onclick="handleOrder(${service.id})">
                                ${btnText}
                            </button>
                        </div>
                    </div>
                `;

          listingsContainer.appendChild(card);
        });
      }

      // Render Request Cards
      function renderRequestListings(requests) {
        requests.forEach((request, index) => {
          const card = document.createElement("div");
          card.className = "request-card slide-up";
          card.style.animationDelay = `${index * 0.1}s`;

          card.innerHTML = `
                    <div class="request-header">
                        <div>
                            <h3 class="request-title">${request.title}</h3>
                            <div class="request-time">
                                <i class="fas fa-clock"></i> ${request.time} • ${request.distance}km away
                            </div>
                        </div>
                        <div class="request-budget">₦${request.budget.toLocaleString()}</div>
                    </div>
                    <div class="request-body">
                        <p class="request-description">${request.description}</p>
                        <div class="request-tags">
                            ${request.tags.map((tag) => `<span class="request-tag">${tag}</span>`).join("")}
                        </div>
                    </div>
                    <div class="request-footer">
                        <div class="requester-info">
                            <img src="${request.requesterAvatar}" alt="${request.requesterName}" class="requester-avatar">
                            <div class="requester-meta">
                                <span class="requester-name">${request.requesterName}</span>
                                <span class="requester-rating">
                                    <i class="fas fa-shield-alt"></i> ${request.requesterRating}% Rating
                                </span>
                            </div>
                        </div>
                        <button class="respond-btn" onclick="handleRespond(${request.id})">Respond</button>
                    </div>
                `;

          listingsContainer.appendChild(card);
        });
      }

      // Generate Star Rating
      function generateStars(rating) {
        let stars = "";
        const fullStars = Math.floor(rating);
        const hasHalf = rating % 1 >= 0.5;

        for (let i = 0; i < 5; i++) {
          if (i < fullStars) {
            stars += '<i class="fas fa-star"></i>';
          } else if (i === fullStars && hasHalf) {
            stars += '<i class="fas fa-star-half-alt"></i>';
          } else {
            stars += '<i class="far fa-star"></i>';
          }
        }
        return stars;
      }

      // Filter Listings
      function filterListings() {
        if (state.userType === "customer") {
          let filtered = mockServices;

          if (state.activeFilter !== "all") {
            filtered = filtered.filter(
              (s) => s.category === state.activeFilter,
            );
          }

          if (state.searchQuery) {
            filtered = filtered.filter(
              (s) =>
                s.title.toLowerCase().includes(state.searchQuery) ||
                s.providerName.toLowerCase().includes(state.searchQuery) ||
                s.category.toLowerCase().includes(state.searchQuery),
            );
          }

          listingsContainer.innerHTML = "";
          if (filtered.length === 0) {
            renderEmptyState();
          } else {
            renderServiceListings(filtered);
          }
        } else {
          let filtered = mockRequests;

          if (state.activeFilter !== "all") {
            filtered = filtered.filter(
              (r) => r.category === state.activeFilter,
            );
          }

          if (state.searchQuery) {
            filtered = filtered.filter(
              (r) =>
                r.title.toLowerCase().includes(state.searchQuery) ||
                r.description.toLowerCase().includes(state.searchQuery),
            );
          }

          listingsContainer.innerHTML = "";
          if (filtered.length === 0) {
            renderEmptyState();
          } else {
            renderRequestListings(filtered);
          }
        }
      }

      // Render Empty State
      function renderEmptyState() {
        listingsContainer.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-search"></i>
                    <h3>No results found</h3>
                    <p>Try adjusting your search or filters</p>
                </div>
            `;
      }

      // Sort by Distance
      function sortListingsByDistance() {
        mockServices.sort((a, b) => a.distance - b.distance);
        mockRequests.sort((a, b) => a.distance - b.distance);
        loadListings();
      }

      // Handle Order
      window.handleOrder = function (id) {
        const service = mockServices.find((s) => s.id === id);
        showToast(`Order request sent to ${service.providerName}`, "success");
      };

      // Handle Respond
      window.handleRespond = function (id) {
        const request = mockRequests.find((r) => r.id === id);
        showToast(`Response sent to ${request.requesterName}`, "success");
      };

      // Toast Notification
      function showToast(message, type = "info") {
        const toast = document.createElement("div");
        toast.className = `toast ${type}`;

        const icons = {
          success: "fa-check-circle",
          error: "fa-exclamation-circle",
          info: "fa-info-circle",
        };

        toast.innerHTML = `
                <i class="fas ${icons[type]}"></i>
                <span>${message}</span>
            `;

        toastContainer.appendChild(toast);

        setTimeout(() => {
          toast.remove();
        }, 3000);
      }

      // Start
      init();
    </script>
  </body>
</html>
